<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="qr-card">
      <div class="qr-img-container">
        <img src="images/image-qr-code.png" class="qr-img">
      </div>
      <div class="qr-content">
        <h1>&nbsp;Improve your front-end <br> skills by building project</h1>
        <p>&nbsp; &nbsp; scan the qr-code to visit Frontend <br> Mentor and take your coding skills to <br><span class="spanEl">the next level</span> </p>
      </div>
    </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Ayomide936/Profile">code empire</a>.
  </div>
  </main>
</body>
</html>
